[project]
name = "alpha-fox-backend"
version = "0.1.0"
description = "Backend API and radio control services for alpha_fox."
authors = [
    { name = "tturner", email = "tturner@bastiansolutions.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyserial>=3.5",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "sounddevice>=0.5.0",
    "pyyaml>=6.0.2",
]

[tool.poetry]
packages = [
    { include = "alpha_fox" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"